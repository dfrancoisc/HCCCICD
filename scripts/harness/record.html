<!doctype html>
<meta charset="utf-8">
<title>Change Control</title>
<!--
  Recording host for the tool.

  Change Control never authenticates itself: it runs in an iframe inside the
  Interoperability editor and asks its parent for the access token the editor
  already holds. A recorder opening the tool directly has no parent, so the
  API rejects it and the walkthrough would be a screenshot of the sign-in
  prompt.

  This page is the smallest possible stand-in for that parent — a full-bleed
  iframe that answers the same hcccicd:need-auth handshake. The credential is
  passed in on the query string by scripts/record-production-journey.py and is
  never stored here.

    record.html?src=<encoded tool url>&auth=<Authorization header>&ns=HSCUSTOM
-->
<style>
  html, body { margin:0; height:100%; background:#0b0d11; }
  iframe { display:block; border:0; width:100%; height:100%; }
</style>
<iframe id="f" title="Change Control"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var auth = q.get('auth') || '';
  var ns = q.get('ns') || '';

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d && d.type === 'hcccicd:need-auth' && e.source) {
      e.source.postMessage({ type: 'hcccicd:auth', bearer: auth, namespace: ns }, '*');
    }
  });

  document.getElementById('f').src = q.get('src') || 'about:blank';
</script>
